[project]
name = "reliable-tool-agent"
version = "0.1.0"
description = "A customer-support agent with tools over MCP, guardrails, human approval, observability and state-based evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]

[tool.uv]
# Notebooks are for local learning only; CI skips them (see .github/workflows/ci.yml).
default-groups = ["dev", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliable_tool_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
